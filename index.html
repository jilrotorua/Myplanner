evice-width,initial-scale=1,viewport-fit=cover"><style>
:root{--ink:#3c3456;--muted:#817c91;--paper:#fffefa;--lav:#eee6ff;--pink:#ffe3ed;--blue:#e1f3ff;--mint:#e0f5e8;--peach:#ffe9d5;--border:#e7dff1}*{box-sizing:border-box}body{margin:0;background:#f7f2fc;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:18px}.header{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:clamp(25px,4vw,38px);font-weight:800;letter-spacing:-1px}.subtitle{color:var(--muted);font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.btn{border:1px solid var(--border);border-radius:14px;padding:10px 14px;background:white;color:var(--ink);font-weight:650}.btn.primary{background:#7252bd;color:white;border-color:#7252bd}.btn:disabled{opacity:.55}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.nav .btn.active{background:var(--lav);border-color:#bca5f2}.card{background:var(--paper);border:1px solid var(--border);border-radius:22px;box-shadow:0 8px 30px #5843830d;padding:20px;margin:16px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.sectionhead h2{margin:0;font-size:23px}.datebar{display:flex;align-items:center;gap:9px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:15px}.weekday{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:7px 0}.day{min-height:83px;text-align:left;background:white;border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;color:var(--ink)}.day.today{border:2px solid #ad89f4}.day.selected{background:#eee6ff}.day.empty{visibility:hidden}.dot{display:inline-block;border-radius:50%;width:7px;height:7px;background:#ad89f4;margin-right:3px}.count{font-size:10px;color:var(--muted)}.entry{padding:12px 14px;border-radius:14px;background:#f9f6ff;border:1px solid var(--border);margin-top:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.entry small{color:var(--muted)}.entry.done{opacity:.55}.entry.done .entrytitle{text-decoration:line-through}.tag{font-size:11px;border-radius:9px;padding:3px 7px;background:var(--pink);display:inline-block;margin-left:5px}.fields{display:grid;gap:12px}.fields label{display:grid;gap:5px;font-size:13px;font-weight:700}.fields input,.fields textarea,.fields select{border:1px solid #d9cfe9;background:white;border-radius:12px;padding:12px;width:100%;color:var(--ink)}.fields textarea{min-height:105px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.paper{background:repeating-linear-gradient(to bottom,#fffefa 0,#fffefa 31px,#e9dff3 32px);border:1px solid var(--border);border-radius:16px;overflow:hidden;touch-action:none}.paper canvas{display:block;width:100%;height:460px;touch-action:none}.inktools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.swatch{width:30px;height:30px;border:2px solid white;outline:1px solid #d9cfe9;border-radius:50%}.swatch.active{outline:3px solid #a987ec}.hint{color:var(--muted);font-size:13px}.status{font-size:12px;color:var(--muted)}.pill{background:var(--mint);border-radius:100px;padding:6px 10px;font-size:12px}.gridcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{border-radius:17px;padding:15px;background:var(--pink)}.mini:nth-child(2){background:var(--mint)}.mini:nth-child(3){background:var(--blue)}.mini strong{font-size:24px;display:block}.emptymsg{color:var(--muted);padding:18px 0}.weekrow{display:grid;grid-template-columns:90px 1fr;gap:12px;border-bottom:1px solid var(--border);padding:10px 0}.weekrow:last-child{border:0}.smallbtn{background:none;border:0;color:#7755b4;padding:4px;font-weight:700}.modalback{position:fixed;inset:0;background:#29203888;display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}.modal{width:min(540px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px;padding:23px}.hidden{display:none!important}@media(max-width:640px){.shell{padding:12px}.card{padding:14px}.day{min-height:67px;padding:5px;font-size:12px}.calendar{gap:4px}.twocol{grid-template-columns:1fr}.gridcards{gap:6px}.mini{padding:10px}.mini strong{font-size:19px}.brand{font-size:27px}.weekrow{grid-template-columns:66px 1fr}}

.bookgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px;margin-top:18px}
.bookcover{min-height:175px;border:0;border-radius:12px 23px 23px 12px;padding:18px 12px 18px 25px;text-align:left;box-shadow:inset 9px 0 #ffffff55,4px 7px 14px #392a4922;display:flex;flex-direction:column;justify-content:space-between;overflow-wrap:anywhere}
.bookcover strong{font-size:19px}.bookcover small{opacity:.75}.paper.dotted{background-color:#fffefa;background-image:radial-gradient(#b7afca 1px,transparent 1px);background-size:20px 20px}
.paper.gridpaper{background-color:#fffefa;background-image:linear-gradient(#dbe4ef 1px,transparent 1px),linear-gradient(90deg,#dbe4ef 1px,transparent 1px);background-size:24px 24px}
.paper.blank{background:#fffefa}.budgetrow{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.budgetstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px}.budgetstat{padding:16px;border-radius:16px;background:var(--lav)}.budgetstat strong{display:block;font-size:24px}
@media(max-width:600px){.budgetrow{grid-template-columns:1fr auto}.budgetrow button{grid-column:2}.bookcover{min-height:145px}}

/* Pastel monthly dashboard */
.month-declaration{background:linear-gradient(115deg,#ffe2ef,#eee5ff);border-radius:19px;padding:18px 20px;margin:16px 0;position:relative}
.month-declaration p{white-space:pre-wrap;line-height:1.55;margin:10px 0 0}
.month-calendar .weekday{padding:12px 2px;border-radius:10px;background:#ffe1ee}.month-calendar .weekday:nth-child(7n+2){background:#ffebdb}.month-calendar .weekday:nth-child(7n+3){background:#fff0cb}.month-calendar .weekday:nth-child(7n+4){background:#dcf5e8}.month-calendar .weekday:nth-child(7n+5){background:#ddf1ff}.month-calendar .weekday:nth-child(7n+6){background:#ece2ff}.month-calendar .weekday:nth-child(7n+7){background:#ffe1ee}
.month-calendar .day{min-height:94px;background:linear-gradient(145deg,#fff,#faf6ff);transition:background .15s}.month-calendar .day:nth-child(7n+2){background:#fff5fa}.month-calendar .day:nth-child(7n+4){background:#fffbee}.month-calendar .day:nth-child(7n+5){background:#f2fff9}.month-calendar .day:nth-child(7n+6){background:#f2f9ff}.month-calendar .day.selected{background:#e8dcff}.month-calendar .day.today{border:2px solid #9670d8}
.calendar-preview{font-size:10px;border-radius:6px;padding:3px 5px;background:#f4e5ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.calendar-preview.appointment{background:#dff3ff}.calendar-preview.task{background:#e2f7e7}.calendar-preview.journal{background:#ffe2ec}
.month-summaries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin-top:15px}.month-summary{border:0;border-radius:21px;padding:18px;text-align:left;color:var(--ink);min-height:175px;display:flex;flex-direction:column;gap:9px}.month-summary.finance{background:#ffe1ec}.month-summary.journal{background:#dff1ff}.month-summary.tasks{background:#ffe9c8}.month-summary strong{font-size:20px}.month-summary small{line-height:1.5;overflow-wrap:anywhere}.month-summary .go{margin-top:auto;font-weight:700;color:#6945a9}
@media(max-width:650px){.month-summaries{grid-template-columns:1fr}.month-summary{min-height:unset}.month-calendar .day{min-height:74px;padding:4px}.calendar-preview{font-size:9px;padding:2px}.month-declaration{padding:15px}}

/* Full journal reader and typed notebook pages */
.reader-body{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.75;font-size:16px;padding:15px;background:#faf6ff;border-radius:15px;max-height:60vh;overflow-y:auto}
.notebook-typing{width:100%;min-height:230px;padding:18px 20px;border:1px solid #ddd3ed;border-radius:15px;background:#fffefa;color:var(--ink);line-height:1.65;font-size:16px;resize:vertical;touch-action:pan-y}
.notebook-mode{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
/* Search in journals and notebook pages */
.planner-search{width:100%;padding:13px 15px;border:1px solid #cdbde8;border-radius:14px;background:white;color:var(--ink);font:inherit;margin:12px 0}
.search-result{display:block;width:100%;text-align:left;padding:13px 15px;margin:8px 0;border:1px solid #e3d9f1;background:#f8f4ff;border-radius:13px;color:var(--ink);font:inherit;cursor:pointer}
.search-result small{display:block;color:#756a88;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

</style></head><body><main class="shell"><header class="header"><div><div class="brand">🌷 My Digital Planner</div><div class="subtitle">A little space for every beautiful day ✨</div></div><div class="header-actions"><span class="pill">🌷 Personal planner</span><div class="settings-wrap"><button class="settings-icon" id="settingsToggle" onclick="togglePlannerSettings()" aria-label="Planner settings" title="Settings" aria-expanded="false">⚙️</button><div id="plannerSettings" class="settings-menu hidden"><button class="btn" onclick="exportBackup();togglePlannerSettings(false)">⬇️ Backup Planner</button><button class="btn" onclick="document.getElementById('restoreFile').click();togglePlannerSettings(false)">⬆️ Restore Backup</button><button class="btn" onclick="plannerSyncNow();togglePlannerSettings(false)">☁️ Sync Now</button><button class="btn" onclick="plannerRefresh();togglePlannerSettings(false)">🔄 Refresh Database</button><button class="btn" onclick="plannerConnect();togglePlannerSettings(false)">🔐 Connect Device</button></div></div></div></header><div class="toolbar" style="align-items:center"><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(event)"><span class="status" id="status">Saved on this device • use Backup to transfer</span></div><nav class="nav" id="nav"></nav><section id="content"></section></main><div id="modalback" class="modalback hidden"><div class="modal" id="entryModal"><div class="sectionhead"><h2 id="modalTitle">New entry</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="fields" style="margin-top:16px"><label>Type<select id="eType" onchange="document.getElementById('modalback').classList.toggle('journal-fullscreen',this.value==='journal')"><option value="task">Task</option><option value="appointment">Appointment</option><option value="journal">Journal</option><option value="note">Note</option></select></label><label>Title<input id="eTitle" placeholder="What const KEY='my_digital_planner_private_v1';let records=[],view='month',chosen=localDay(),cursor=new Date(chosen+'T12:00:00'),editing=null,inkTool='pen',inkStyle='natural',inkColor='#6147a8',inkWidth=3,drawing=false,currentStroke=null,inkStrokes=[],bookId=null,pageId=null,inkDirty=false,budgetMonth=localDay().slice(0,7);
function togglePlannerSettings(force){const menu=document.getElementById('plannerSettings');const show=typeof force==='boolean'?force:menu.classList.contains('hidden');menu.classList.toggle('hidden',!show);document.getElementById('settingsToggle').setAttribute('aria-expanded',String(show))}

function localDay(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateObj(s){return new Date(s+'T12:00:00')}function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function load(){try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))records=[]}catch(e){records=[]}}function persist(){localStorage.setItem(KEY,JSON.stringify(records));status('Saved on this device • cloud sync queued');plannerQueueAutoSync()}
function status(s){document.getElementById('status').textContent=s}function active(){return records.filter(r=>!r.deleted)}function carriedOverTask(r,d){return d===localDay()&&r.type==='task'&&!r.done&&!!r.date&&r.date<d}

function onDay(d){return dayEntries(d)}
function saveRecord(r){r.updatedAt=new Date().toISOString();const i=records.findIndex(x=>x.id===r.id);if(i<0)records.push(r);else records[i]=r;persist();render()}
function render(){const tabs=[['month','📅 Month'],['week','🗓️ Week'],['day','☀️ Day'],['tasks','✅ Tasks'],['journal','📖 Journal'],['notebook','✍️ Notebook'],['budget','💰 Budget']];document.getElementById('nav').innerHTML=tabs.map(([v,n])=>`<button class="btn ${v===view?'active':''}" onclick="setView('${v}')">${n}</button>`).join('');const c=document.getElementById('content');c.innerHTML=view==='month'?monthHTML():view==='week'?weekHTML():view==='day'?dayHTML():view==='tasks'?listHTML('task','My Tasks'):view==='journal'?listHTML('journal','My Journal'):view==='budget'?budgetHTML():notebookHTML();if(view==='notebook'&&pageId)initInk()}
function setView(v){if(!confirmLeaveInk())return;view=v;render()}function shiftMonth(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,15);render()}function shiftDay(n){chosen=localDay(new Date(dateObj(chosen).getTime()+n*86400000));cursor=dateObj(chosen);render()}function choose(d,v='day'){chosen=d;cursor=dateObj(d);view=v;render()}

function monthHTML(){
 const y=cursor.getFullYear(),m=cursor.getMonth(),month=localDay(new Date(y,m,15)).slice(0,7),start=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();
 const declaration=declarationForMonth(month);
 const monthly=active().filter(r=>r.date&&r.date.startsWith(month));
 const finance=monthly.filter(r=>r.type==='budget');
 const income=finance.filter(r=>r.kind==='income').reduce((s,r)=>s+Number(r.amount||0),0);
 const expenses=finance.filter(r=>r.kind==='expense').reduce((s,r)=>s+Number(r.amount||0),0);
 const journal=monthly.filter(r=>r.type==='journal').sort((a,b)=>b.date.localeCompare(a.date));
 const tasks=monthly.filter(r=>r.type==='task').sort((a,b)=>a.date.localeCompare(b.date));
 let cells=Array.from({length:start},()=>'<div class="day empty"></div>');
 for(let n=1;n<=count;n++){
  const d=localDay(new Date(y,m,n));
  const items=onDay(d).filter(r=>['task','appointment','journal','note'].includes(r.type));
  cells.push(`<button class="day ${d===localDay()?'today':''} ${d===chosen?'selected':''}" onclick="choose('${d}')"><strong>${n}</strong>${items.slice(0,2).map(r=>`<span class="calendar-preview ${r.type}">${r.type==='task'?'✓ ':r.type==='journal'?'♡ ':'• '}${escapeHTML(r.title)}</span>`).join('')}${items.length>2?`<span class="count">+${items.length-2} more</span>`:''}</button>`);
 }
 const list=(rows,fmt)=>rows.slice(0,4).map(fmt).join('')||'<small>• No entries yet</small>';
 return `<section class="card"><div class="sectionhead"><h2>🌷 ${cursor.toLocaleString('en-NZ',{month:'long',year:'numeric'})}</h2><div class="datebar"><button class="btn" onclick="shiftMonth(-1)">‹</button><button class="btn" onclick="shiftMonth(1)">›</button><button class="btn primary" onclick="openModal()">+ Add</button></div></div>
 <div class="month-declaration"><div class="sectionhead"><h2 style="font-size:19px">👑 My Declaration for ${cursor.toLocaleString('en-NZ',{month:'long'})}</h2><button class="btn" onclick="editMonthDeclaration()" aria-label="Edit monthly declaration">✏️ Edit</button></div><p>${declaration?escapeHTML(declaration.body):'Tap the pencil to write your declaration for this month. 💜'}</p></div>
 <div class="calendar month-calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div></section>
 <div class="month-summaries">
 <button class="month-summary finance" onclick="budgetMonth='${month}';setView('budget')"><strong>💰 Finances</strong><small>• Income: ${money(income)}<br>• Expenses: ${money(expenses)}<br>• Transactions: ${finance.length}<br>• Remaining: ${money(income-expenses)}</small><span class="go">Open Budget →</span></button>
 <button class="month-summary journal" onclick="setView('journal')"><strong>📖 Journal</strong><small>• ${journal.length} entries this month<br>${list(journal,r=>`• ${escapeHTML(r.title)} (${escapeHTML(r.date.slice(8))})<br>`)}</small><span class="go">Open Journal →</span></button>
 <button class="month-summary tasks" onclick="setView('tasks')"><strong>✅ Tasks</strong><small>• ${tasks.filter(r=>!r.done).length} to do<br>• ${tasks.filter(r=>r.done).length} completed<br>${list(tasks,r=>`• ${r.done?'✓ ':''}${escapeHTML(r.title)}<br>`)}</small><span class="go">Open Tasks →</span></button>
 </div>`;
}
function weekStart(){let d=dateObj(chosen);d.setDate(d.getDate()-d.getDay());return d}
function dayCategoryHTML(date){const items=dayEntries(date).filter(r=>!['ink','bookpage','book','debtcharge'].includes(r.type));if(!items.length)return '<p class="emptymsg">No entries for this day.</p>';const categories=[['appointment','📌 Appointments','#e7f0ff'],['task','✅ Tasks','#e7f8ec'],['journal','📖 Journal','#fce8f1'],['note','📝 Notes','#eee7ff'],['budget','💰 Finances','#fff0db']];const shown=new Set();let html='';for(const [type,label,color] of categories){const rows=items.filter(r=>r.type===type);if(!rows.length)continue;rows.forEach(r=>shown.add(r.id));html+=`<div class="day-category" style="background:${color}"><h3>${label} <small>(${rows.length})</small></h3>${type==='budget'?rows.map(r=>`<div class="entry"><div><strong>${escapeHTML(r.title)}</strong> · ${money(r.amount)} <small>${escapeHTML(r.category||'')}</small></div><div><button class="smallbtn" onclick="budgetMonth='${date.slice(0,7)}';budgetForm('${r.id}')">Edit</button><button class="smallbtn" onclick="budgetDelete('${r.id}')">Delete</button></div></div>`).join(''):entryList(rows)}</div>`}const others=items.filter(r=>!shown.has(r.id));if(others.length)html+=`<div class="day-category"><h3>📋 Other entries</h3>${entryList(others)}</div>`;return html}
function weekHTML(){let s=weekStart();return `<div class="card"><div class="sectionhead"><h2>🗓️ This Week</h2><button class="btn primary" onclick="openModal()">+ Add</button></div>${Array.from({length:7},(_,i)=>{let d=new Date(s);d.setDate(d.getDate()+i);let key=localDay(d);return `<div class="weekrow"><button class="smallbtn" onclick="choose('${key}')">${d.toLocaleDateString(undefined,{weekday:'short'})}<br>${d.getDate()}</button><div style="flex:1;min-width:0">${dayCategoryHTML(key)}</div></div>`}).join('')}</div>`}
function dayHTML(){let d=dateObj(chosen),items=onDay(chosen);return `<div class="card"><div class="sectionhead"><div><div class="subtitle">YOUR DAILY PAGE</div><h2>☀️ ${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2></div><div class="datebar"><button class="btn" onclick="shiftDay(-1)">‹</button><button class="btn" onclick="shiftDay(1)">›</button></div></div><div class="gridcards" style="margin-top:18px"><div class="mini"><strong>${items.filter(x=>x.type==='task'&&!x.done).length}</strong>To do</div><div class="mini"><strong>${items.filter(x=>x.type==='appointment').length}</strong>Appointments</div><div class="mini"><strong>${items.filter(x=>x.type==='journal').length}</strong>Journal entries</div></div><div class="sectionhead" style="margin-top:22px"><h2>All of Today's Entries</h2><button class="btn primary" onclick="openModal()">+ Add Entry</button></div>${dayCategoryHTML(chosen)}</div><div class="card"><div class="sectionhead"><h2>✍️ Handwriting for today</h2><button class="btn" onclick="setView('notebook')">Open notebook →</button></div><p class="hint">Write with your Apple Pencil or finger on a separate lined notebook page.</p></div>`}
function escapeHTML(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function entryList(items){if(!items.length)return '<p class="emptymsg">Nothing here yet. Add something lovely! 🌷</p>';return items.map(r=>`<div class="entry ${r.done?'done':''}"><div>${r.type==='task'?`<input type="checkbox" ${r.done?'checked':''} onchange="toggleDone('${r.id}')" aria-label="Complete task">`:''}<strong class="entrytitle">${escapeHTML(r.title)}</strong><span class="tag">${escapeHTML(r.type)}</span>${carriedOverTask(r,localDay())?`<span class="tag" style="background:#fff0d8;color:#845200">🕒 Carried Over · ${escapeHTML(r.date)}</span>`:''}<div><small>${escapeHTML(r.time||'')}${r.body?' · '+escapeHTML(r.body).slice(0,150):''}</small></div></div><div>${r.type==='journal'?`<button class="smallbtn" onclick="viewJournal('${r.id}')">View</button>`:''}<button class="smallbtn" onclick="openModal('${r.id}')">Edit</button><button class="smallbtn" onclick="removeEntry('${r.id}')">Delete</button></div></div>`).join('')}
function viewJournal(id){
 const r=records.find(x=>x.id===id&&x.type==='journal'&&!x.deleted);if(!r)return;
 const back=document.createElement('div');back.className='modalback';back.id='journalReader';
 back.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="Journal entry" style="width:min(760px,100%)"><div class="sectionhead"><div><h2>📖 ${escapeHTML(r.title)}</h2><p class="hint">${escapeHTML(r.date||'')}</p></div><button class="btn" onclick="closeJournalReader()">✕ Close</button></div><div class="reader-body">${escapeHTML(r.body||'No details written yet.')}</div><div class="toolbar"><button class="btn primary" onclick="closeJournalReader();openModal('${r.id}')">✏️ Edit entry</button><button class="btn" onclick="closeJournalReader()">Done</button></div></div>`;
 document.body.appendChild(back);
}
function closeJournalReader(){document.getElementById('journalReader')?.remove()}
function listHTML(type,title){let items=active().filter(x=>x.type===type).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="card"><div class="sectionhead"><h2>${title}</h2><button class="btn primary" onclick="openModal(null,'${type}')">+ Add</button></div>${type==='journal'?'<label for="journalSearch" class="hint">🔎 Search journal titles and written text</label><input id="journalSearch" class="planner-search" type="search" placeholder="Search my journal..." oninput="searchJournal(this.value)"><div id="journalSearchResults" aria-live="polite"></div>':''}<div id="journalEntries">${entryList(items)}</div></div>`}
function searchJournal(value){const q=value.trim().toLocaleLowerCase();const all=active().filter(x=>x.type==='journal').sort((a,b)=>(b.date||'').localeCompare(a.date||''));const matches=q?all.filter(r=>[r.title,r.body,r.date].some(v=>String(v||'').toLocaleLowerCase().includes(q))):all;document.getElementById('journalEntries').innerHTML=matches.length?entryList(matches):'<p class="emptymsg">No matching journal entries.</p>'}

function openModal(id=null,type='task'){editing=id;let r=id?records.find(x=>x.id===id):null;document.getElementById('modalTitle').textContent=r?'Edit Entry':'New Entry';document.getElementById('eType').value=r?.type||type;document.getElementById('eTitle').value=r?.title||'';document.getElementById('eDate').value=r?.date||chosen;document.getElementById('eTime').value=r?.time||'';document.getElementById('eBody').value=r?.body||'';document.getElementById('modalback').classList.remove('hidden');document.getElementById('modalback').classList.toggle('journal-fullscreen',document.getElementById('eType').value==='journal')}
function closeModal(){document.getElementById('modalback').classList.add('hidden');document.getElementById('modalback').classList.remove('journal-fullscreen')}
function saveEntry(){const title=document.getElementById('eTitle').value.trim();if(!title){alert('Please enter a title.');return}const r=editing?{...records.find(x=>x.id===editing)}:{id:uid(),done:false};Object.assign(r,{type:document.getElementById('eType').value,title,date:document.getElementById('eDate').value||chosen,time:document.getElementById('eTime').value,body:document.getElementById('eBody').value});saveRecord(r);closeModal()}
function toggleDone(id){let r=records.find(x=>x.id===id);if(r){r.done=!r.done;saveRecord(r)}}function removeEntry(id){if(!confirm('Delete this entry?'))return;let r=records.find(x=>x.id===id);if(r){r.deleted=true;saveRecord(r)}}
function confirmLeaveInk(){return !inkDirty||confirm('You have unsaved handwriting. Leave without saving?')}
function notebooks(){return active().filter(r=>r.type==='book')}
function bookPages(id){return active().filter(r=>r.type==='bookpage'&&r.bookId===id).sort((a,b)=>(a.order||0)-(b.order||0))}
function currentPage(){return records.find(r=>r.id===pageId&&r.type==='bookpage'&&!r.deleted)}
function inkRecord(){return currentPage()}
function topicPages(page){if(!page)return [];const topic=page.topicId||page.id;return bookPages(bookId).filter(p=>(p.topicId||p.id)===topic)}
function addContinuationPage(){const page=currentPage();if(!page)return;if(inkDirty){if(!saveInk())return;}const group=topicPages(page);const r={id:uid(),type:'bookpage',bookId:bookId,topicId:page.topicId||page.id,title:page.title,paper:page.paper||'lined',order:bookPages(bookId).length,strokes:[]};saveRecord(r);pageId=r.id;inkDirty=false;render()}
function showBook(id){if(!confirmLeaveInk())return;bookId=id;pageId=null;inkDirty=false;render()}
function openPage(id){if(!confirmLeaveInk())return;pageId=id;inkDirty=false;render()}
function openNotebookLibrary(){if(!confirmLeaveInk())return;bookId=null;pageId=null;inkDirty=false;render()}
function notebookSearchBox(){return `<label for="notebookSearch" class="hint">🔎 Search notebook names, topics and typed notes</label><input id="notebookSearch" class="planner-search" type="search" placeholder="Search all my notebooks..." oninput="searchNotebooks(this.value)"><div id="notebookSearchResults" aria-live="polite"></div>`}
function deleteNotebook(id){const book=records.find(r=>r.id===id&&r.type==='book'&&!r.deleted);if(!book)return;const pages=bookPages(id);if(!confirm('Delete the entire notebook "'+book.title+'" and all '+pages.length+' pages? This cannot be undone after syncing. Make sure your backup is saved.'))return;const now=new Date().toISOString();for(const r of [book,...pages]){r.deleted=true;r.updatedAt=now}if(bookId===id){bookId=null;pageId=null;inkDirty=false}persist();render();status('Notebook deleted on this device • use Sync Now to sync deletion')}
function searchNotebooks(value){const q=value.trim().toLocaleLowerCase();const target=document.getElementById('notebookSearchResults');if(!target)return;if(!q){target.innerHTML='';return}const books=notebooks();const matchedBooks=books.filter(b=>String(b.title||'').toLocaleLowerCase().includes(q));const matchedPages=active().filter(p=>p.type==='bookpage'&&[p.title,p.typedText].some(v=>String(v||'').toLocaleLowerCase().includes(q)));if(!matchedBooks.length&&!matchedPages.length){target.innerHTML='<p class="hint">No matching notebooks or typed notes.</p>';return}target.innerHTML=matchedBooks.map(b=>`<button class="search-result" onclick="showBook('${b.id}')">📚 ${escapeHTML(b.title)}<small>Open notebook</small></button>`).join('')+matchedPages.map(p=>{const b=books.find(x=>x.id===p.bookId);return `<button class="search-result" onclick="openSearchedPage('${p.bookId}','${p.id}')">📄 ${escapeHTML(p.title||'Untitled')}<small>${escapeHTML(b?.title||'Notebook')} · ${escapeHTML((p.typedText||'').slice(0,110))}</small></button>`}).join('')}
function openSearchedPage(bid,pid){if(!confirmLeaveInk())return;bookId=bid;pageId=pid;inkDirty=false;render()}
function notebookHTML(){
 if(!bookId){const books=notebooks();return `<section class="card"><div class="sectionhead"><h2>📚 My Notebook Collection</h2><button class="btn primary" onclick="bookForm()">+ Create Notebook</button></div><p class="hint">Choose a cover and create as many handwritten notebooks as you like.</p>${notebookSearchBox()}<div class="bookgrid">${books.map(b=>`<button class="bookcover" style="background:${b.cover||'#eee6ff'}" onclick="showBook('${b.id}')"><span style="font-size:27px">📖</span><strong>${escapeHTML(b.title)}</strong><small>${bookPages(b.id).length} pages</small></button>`).join('')}</div>${!books.length?'<p class="emptymsg">Your notebook shelf is empty. Create your first notebook! 🌷</p>':''}</section>`}
 const book=records.find(r=>r.id===bookId&&!r.deleted);if(!book){bookId=null;return notebookHTML()}
 if(!pageId){const pages=bookPages(bookId);const topics=pages.filter(p=>!p.topicId||!pages.some(root=>root.id===p.topicId));return `<section class="card"><button class="btn" onclick="openNotebookLibrary()">← My notebooks</button><div class="sectionhead" style="margin-top:15px"><h2>📖 ${escapeHTML(book.title)}</h2><div><button class="btn" onclick="bookForm('${book.id}')">Edit cover</button> <button class="btn primary" onclick="pageForm()">+ New Page</button></div></div>${notebookSearchBox()}<div class="bookgrid">${topics.map((p,i)=>{const count=topicPages(p).length;return `<button class="bookcover" style="background:${book.cover||'#eee6ff'}" onclick="openPage('${p.id}')"><span>📁 Topic · ${i+1}</span><strong>${escapeHTML(p.title||'Untitled topic')}</strong><small>${count} ${count===1?'page':'pages'} · ${escapeHTML(p.paper||'lined')} paper</small></button>`}).join('')}</div>${!pages.length?'<p class="emptymsg">Add your first page to start writing.</p>':''}</section>`}
 const page=currentPage();if(!page){pageId=null;return notebookHTML()}
 const pages=topicPages(page),index=pages.findIndex(p=>p.id===pageId);
 return `<section class="card"><button class="btn" onclick="showBook('${bookId}')">← ${escapeHTML(book.title)}</button><div class="sectionhead" style="margin-top:15px"><div><h2>📄 ${escapeHTML(page.title)}</h2><p class="hint">Page ${index+1} of ${pages.length} · ${escapeHTML(page.paper||'lined')} paper</p></div><div><button class="btn" onclick="pageForm('${page.id}')">Edit title</button> <button class="btn" onclick="deletePage()">Delete page</button></div></div><div id="notebookReadToolbar" class="toolbar"><button class="btn primary" onclick="editNotebookPage()">✏️ Edit page</button><span class="pill">🔒 Read-only view</span></div><div id="notebookEditToolbar" class="toolbar" style="display:none"><button class="btn primary" onclick="saveAndViewNotebook()">💾 Save & View Page</button><button class="btn" onclick="cancelNotebookEdit()">Cancel</button><label class="hint">Writing mode <select id="notebookMode" onchange="setNotebookMode(this.value)"><option value="type">⌨️ Type / Scribble to text</option><option value="draw">✍️ Handwriting / Calligraphy</option></select></label><label class="hint"><input type="checkbox" id="penOnly" checked> Apple Pencil only (palm rejection)</label></div><div id="notebookPageSurface" class="paper ${page.paper==='dotted'?'dotted':page.paper==='grid'?'gridpaper':page.paper==='blank'?'blank':''}" style="position:relative;min-height:600px"><textarea id="pageTypedNotes" class="notebook-typing" placeholder="Write here with keyboard or Apple Scribble..." oninput="inkDirty=true" style="display:none;position:relative;z-index:2;box-sizing:border-box;width:100%;height:600px;min-height:600px;background:transparent;border:0;resize:vertical;font-size:18px;line-height:1.9;padding:22px;outline:none">${escapeHTML(page.typedText||'')}</textarea><div id="notebookReadText" style="white-space:pre-wrap;overflow-wrap:anywhere;position:relative;z-index:2;padding:22px;font-size:18px;line-height:1.9;min-height:560px;pointer-events:none">${escapeHTML(page.typedText||'')}</div><canvas id="inkcanvas" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1"></canvas></div><div id="notebookInkTools" style="display:none"><div class="inktools"><button class="btn" id="penbtn" onclick="setInkTool('pen')">✒️ Pen</button><button class="btn" id="erasebtn" onclick="setInkTool('eraser')">◻ Eraser</button><label class="hint">Writing style <select id="inkStyleSelect" onchange="setInkStyle(this.value)"><option value="natural">✍️ My Handwriting</option><option value="fine">🖊️ Fine Pen</option><option value="calligraphy">✒️ Calligraphy</option><option value="brush">🖌️ Brush Pen</option></select></label>${['#6147a8','#e95d92','#2081ab','#2b946f','#222222'].map(c=>`<button class="swatch ${c===inkColor?'active':''}" style="background:${c}" onclick="setInkColor('${c}')" aria-label="Ink colour"></button>`).join('')}<label class="hint">Width <input type="range" min="1" max="14" value="${inkWidth}" oninput="inkWidth=Number(this.value)"></label><button class="btn" onclick="undoInk()">↶ Undo</button><button class="btn" onclick="clearInk()">Clear handwriting</button></div><p class="hint">Apple Pencil only ignores finger and palm touches. Turn it off if using a finger or universal stylus that appears as touch.</p></div><div class="toolbar"><button class="btn primary" onclick="addContinuationPage()">＋ Add Page to This Topic</button><label class="hint">Pages in this topic <select aria-label="Select page within topic" onchange="openPage(this.value)">${pages.map((p,i)=>`<option value="${p.id}" ${p.id===pageId?'selected':''}>Page ${i+1}</option>`).join('')}</select></label><button class="btn" onclick="pageNavigate(-1)" ${index===0?'disabled':''}>← Previous</button><button class="btn" onclick="pageNavigate(1)" ${index===pages.length-1?'disabled':''}>Next →</button></div><p class="hint">Saved pages open in read-only view. Tap Edit page to type or draw. Use Save & View Page when finished.</p></section>`
}
let notebookEditing=false, notebookWritingMode='type', activeInkPointer=null;
function notebookUI(){const edit=document.getElementById('notebookEditToolbar'),read=document.getElementById('notebookReadToolbar'),text=document.getElementById('pageTypedNotes'),readText=document.getElementById('notebookReadText'),canvas=document.getElementById('inkcanvas'),tools=document.getElementById('notebookInkTools');if(!canvas)return;edit.style.display=notebookEditing?'flex':'none';read.style.display=notebookEditing?'none':'flex';const typing=notebookEditing&&notebookWritingMode==='type';text.style.display=typing?'block':'none';readText.style.display=notebookEditing?'none':'block';if(!notebookEditing)readText.textContent=text.value;canvas.style.pointerEvents=notebookEditing&&notebookWritingMode==='draw'?'auto':'none';tools.style.display=notebookEditing&&notebookWritingMode==='draw'?'block':'none';const mode=document.getElementById('notebookMode');if(mode)mode.value=notebookWritingMode;}
function editNotebookPage(){notebookEditing=true;notebookWritingMode='type';notebookUI()}
function setNotebookMode(mode){notebookWritingMode=mode==='draw'?'draw':'type';notebookUI()}
function saveAndViewNotebook(){if(!saveInk())return;notebookEditing=false;notebookUI()}
function cancelNotebookEdit(){if(inkDirty&&!confirm('Discard changes since your last save?'))return;const r=inkRecord();inkStrokes=JSON.parse(JSON.stringify(r?.strokes||[]));document.getElementById('pageTypedNotes').value=r?.typedText||'';inkDirty=false;notebookEditing=false;paintInk();notebookUI()}
function pageNavigate(n){const pages=topicPages(currentPage()),i=pages.findIndex(p=>p.id===pageId)+n;if(pages[i])openPage(pages[i].id)}
function bookForm(id){const b=id?records.find(r=>r.id===id):null;showCustomForm(b?'Edit Notebook':'New Notebook',[['title','Notebook name','text',b?.title||''],['cover','Cover colour','select',b?.cover||'#ffe3ed',[['#ffe3ed','Pink'],['#eee6ff','Lavender'],['#e1f3ff','Sky Blue'],['#e0f5e8','Mint'],['#ffe9d5','Peach'],['#fff3b9','Yellow']]]],values=>{if(!values.title.trim())return alert('Enter a notebook name');saveRecord({...b,id:b?.id||uid(),type:'book',title:values.title.trim(),cover:values.cover});closeCustomForm()});if(b){const form=document.getElementById('customForm');const del=document.createElement('button');del.type='button';del.className='btn';del.textContent='🗑️ Delete Notebook';del.style.cssText='color:#a42b4b;border:1px solid #e9b6c5;background:#fff3f6';del.onclick=()=>{closeCustomForm();deleteNotebook(b.id)};form.appendChild(del)}}
function pageForm(id){const p=id?records.find(r=>r.id===id):null;showCustomForm(p?'Edit Page':'New Page',[['title','Page title','text',p?.title||''],['paper','Paper style','select',p?.paper||'lined',[['lined','Lined'],['dotted','Dotted'],['grid','Grid'],['blank','Blank']]]],values=>{if(!values.title.trim())return alert('Enter a page title');const r={...p,id:p?.id||uid(),type:'bookpage',bookId:bookId,title:values.title.trim(),paper:values.paper,order:p?.order??bookPages(bookId).length,topicId:p?.topicId||null,strokes:p?.strokes||[]};saveRecord(r);pageId=r.id;inkDirty=false;closeCustomForm();render()})}
function deletePage(){if(!confirm('Delete this page and its handwriting?'))return;const p=currentPage();if(p){p.deleted=true;saveRecord(p);pageId=null;inkDirty=false;render()}}
function showCustomForm(title,fields,callback){const back=document.createElement('div');back.className='modalback';back.id='customFormBack';back.innerHTML=`<div class="modal"><div class="sectionhead"><h2>${escapeHTML(title)}</h2><button class="btn" id="customClose">✕</button></div><form id="customForm" class="fields" style="margin-top:16px">${fields.map(([key,label,type,value,options])=>`<label>${escapeHTML(label)}${type==='select'?`<select name="${key}">${options.map(([v,t])=>`<option value="${escapeHTML(v)}" ${v===value?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select>`:type==='textarea'?`<textarea name="${key}" rows="6">${escapeHTML(value)}</textarea>`:`<input name="${key}" type="${type}" value="${escapeHTML(value)}" ${type==='number'?'step="0.01" min="0"':''}>`}</label>`).join('')}<button class="btn primary" type="submit">💜 Save</button></form></div>`;document.body.appendChild(back);back.querySelector('#customClose').onclick=closeCustomForm;back.querySelector('form').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)))} }
function closeCustomForm(){document.getElementById('customFormBack')?.remove()}
function setInkTool(t){inkTool=t;document.getElementById('penbtn').style.background=t==='pen'?'#eee6ff':'';document.getElementById('erasebtn').style.background=t==='eraser'?'#eee6ff':''}function setInkColor(c){inkColor=c;inkTool='pen';const el=document.getElementById('inkcanvas');if(el)setInkTool('pen');document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.style.backgroundColor===c))}
function setInkStyle(style){inkStyle=['natural','fine','calligraphy','brush'].includes(style)?style:'natural';inkTool='pen';setInkTool('pen')}
function initInk(){const c=document.getElementById('inkcanvas');c.width=1000;c.height=600;c.style.touchAction="none";inkStrokes=JSON.parse(JSON.stringify(inkRecord()?.strokes||[]));c.addEventListener('pointerdown',pointerDown);c.addEventListener('pointermove',pointerMove);c.addEventListener('pointerup',pointerUp);c.addEventListener('pointercancel',pointerUp);c.addEventListener('lostpointercapture',()=>{drawing=false;currentStroke=null;activeInkPointer=null});setInkTool(inkTool);notebookEditing=false;activeInkPointer=null;notebookUI();const sel=document.getElementById('inkStyleSelect');if(sel)sel.value=inkStyle;paintInk()}
function point(e,canvas){const r=canvas.getBoundingClientRect();return {x:Math.round((e.clientX-r.left)*canvas.width/Math.max(1,r.width)),y:Math.round((e.clientY-r.top)*canvas.height/Math.max(1,r.height)),pressure:e.pointerType==='pen'&&e.pressure>0?Math.round(e.pressure*100)/100:null}}
function pointerDown(e){if(!notebookEditing||notebookWritingMode!=='draw')return;if(document.getElementById('penOnly')?.checked&&e.pointerType!=='pen')return;if(activeInkPointer!==null)return;if(e.pointerType==='mouse'&&e.button!==0)return;activeInkPointer=e.pointerId;e.preventDefault();const canvas=e.currentTarget;try{canvas.setPointerCapture(e.pointerId)}catch(_){}drawing=true;const p=point(e,canvas);if(inkTool==='eraser'){inkDirty=true;eraseAt(p);return}currentStroke={color:inkColor,width:inkWidth,style:inkStyle,points:[p]};inkStrokes.push(currentStroke);inkDirty=true;paintInk()}
function pointerMove(e){if(!drawing||e.pointerId!==activeInkPointer)return;e.preventDefault();const canvas=e.currentTarget;const events=typeof e.getCoalescedEvents==='function'?e.getCoalescedEvents():[];const samples=events.length?events:[e];for(const ev of samples){const p=point(ev,canvas);if(inkTool==='eraser'){inkDirty=true;eraseAt(p)}else if(currentStroke){const last=currentStroke.points[currentStroke.points.length-1];if(Math.hypot(last.x-p.x,last.y-p.y)>=1.6){currentStroke.points.push(p);inkDirty=true}}}if(inkTool!=='eraser')paintInk()}
function pointerUp(e){if(e&&e.pointerId!==activeInkPointer)return;activeInkPointer=null;if(drawing&&e&&currentStroke){const p=point(e,e.currentTarget);const last=currentStroke.points[currentStroke.points.length-1];if(Math.hypot(last.x-p.x,last.y-p.y)>=1.6)currentStroke.points.push(p);paintInk()}drawing=false;currentStroke=null}
function eraseAt(p){inkStrokes=inkStrokes.filter(s=>!s.points.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<20));paintInk()}
function strokeSize(s,p,prev){const base=Math.max(1,Number(s.width)||3)*2;const style=s.style||'natural';if(style==='fine')return Math.max(1,base*.46);if(style==='natural')return base;if(style==='calligraphy'){const dx=p.x-prev.x,dy=p.y-prev.y;const downward=Math.max(0,dy/Math.max(1,Math.hypot(dx,dy)));const pressure=p.pressure==null?1:(.65+p.pressure*.75);return Math.max(1,base*(.35+downward*1.3)*pressure)}if(style==='brush'){const distance=Math.hypot(p.x-prev.x,p.y-prev.y);const pressure=p.pressure==null?Math.max(.38,Math.min(1.15,1.1-distance/26)):(.28+p.pressure*1.3);return Math.max(1,base*1.6*pressure)}return base}
function paintInk(){const c=document.getElementById('inkcanvas');if(!c)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);inkStrokes.forEach(s=>{const pts=s.points;if(!pts?.length)return;ctx.save();ctx.fillStyle=s.color;ctx.strokeStyle=s.color;ctx.lineCap='round';ctx.lineJoin='round';if(pts.length===1){ctx.beginPath();ctx.arc(pts[0].x,pts[0].y,Math.max(1,strokeSize(s,pts[0],pts[0])/2),0,Math.PI*2);ctx.fill()}else if(!s.style||s.style==='natural'||s.style==='fine'){ctx.beginPath();ctx.lineWidth=strokeSize(s,pts[1],pts[0]);ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length-1;i++){const midX=(pts[i].x+pts[i+1].x)/2,midY=(pts[i].y+pts[i+1].y)/2;ctx.quadraticCurveTo(pts[i].x,pts[i].y,midX,midY)}ctx.lineTo(pts[pts.length-1].x,pts[pts.length-1].y);ctx.stroke()}else{for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const w=strokeSize(s,b,a);ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}ctx.restore()})}
function undoInk(){inkStrokes.pop();inkDirty=true;paintInk()}function clearInk(){if(confirm('Clear all handwriting on this page?')){inkStrokes=[];inkDirty=true;paintInk()}}
// Reduce excessive sampled pen points without changing the original visible drawing.
function compactInkStrokes(strokes,step){return strokes.map(st=>{const pts=st.points||[];if(pts.length<3)return {...st,points:pts.map(p=>({x:p.x,y:p.y,...(p.pressure==null?{}:{pressure:p.pressure})}))};const result=[pts[0]];for(let i=1;i<pts.length-1;i++){const p=pts[i],last=result[result.length-1],next=pts[i+1];const dist=Math.hypot(p.x-last.x,p.y-last.y);const cross=Math.abs((p.x-last.x)*(next.y-p.y)-(p.y-last.y)*(next.x-p.x));const turn=cross/Math.max(1,Math.hypot(next.x-last.x,next.y-last.y));if(dist>=step||turn>step*.42)result.push(p)}result.push(pts[pts.length-1]);return {...st,points:result.map(p=>({x:Math.round(p.x),y:Math.round(p.y),...(p.pressure==null?{}:{pressure:Math.round(p.pressure*10)/10})}))}})}
function saveInk(){const old=inkRecord();if(!old)return false;const typedInput=document.getElementById('pageTypedNotes');const typedText=typedInput?typedInput.value:(old.typedText||'');let saved=null;for(const step of [1.5,2.5,4,6,9]){const candidate={...old,typedText,strokes:compactInkStrokes(inkStrokes,step)};if(JSON.stringify(candidate).length<=900000){saved=candidate;break}}if(!saved){alert('This page contains a very large amount of handwriting. Your writing is still on screen. Please make a new page after saving a shorter section; do not close this page until you have a backup.');return false}try{saveRecord(saved);inkStrokes=JSON.parse(JSON.stringify(saved.strokes));inkDirty=false;status('Handwriting saved on this device • make a backup to transfer');return true}catch(e){alert('Could not save handwriting: '+e.message+' Please do not close this page before backing up.');return false}}

function money(n){return new Intl.NumberFormat('en-NZ',{style:'currency',currency:'NZD'}).format(Number(n)||0)}
function budgetRows(){return active().filter(r=>r.type==='budget'&&r.date?.slice(0,7)===budgetMonth).sort((a,b)=>b.date.localeCompare(a.date))}
function debtList(){return active().filter(r=>r.type==='debt').sort((a,b)=>a.title.localeCompare(b.title))}
function debtPayments(id){return active().filter(r=>r.type==='budget'&&r.kind==='expense'&&r.debtId===id)}
function debtCharges(id){return active().filter(r=>r.type==='debtcharge'&&r.debtId===id)}
function debtStats(debt){const paid=debtPayments(debt.id).reduce((s,r)=>s+Number(r.amount||0),0),charges=debtCharges(debt.id).reduce((s,r)=>s+Number(r.amount||0),0),total=Number(debt.amount||0)+charges;return {paid,charges,total,balance:Math.max(0,total-paid),progress:total>0?Math.min(100,paid/total*100):100}}
function debtHTML(){const debts=debtList();const outstanding=debts.reduce((s,d)=>s+debtStats(d).balance,0);return `<section class="card"><div class="sectionhead"><h2>💳 My Debt Tracker</h2><button class="btn primary" onclick="debtForm()">+ Add Debt</button></div><p class="hint">Debt payments are recorded as expenses once, then automatically deducted from the linked debt. New credit-card purchases, interest and fees can be added separately. Card purchases increase your debt balance; they are not automatically added to monthly cash expenses.</p><div class="budgetstats"><div class="budgetstat" style="background:var(--peach)">Total still owed<strong>${money(outstanding)}</strong></div><div class="budgetstat" style="background:var(--mint)">Total payments<strong>${money(debts.reduce((s,d)=>s+debtStats(d).paid,0))}</strong></div></div>${debts.length?debts.map(d=>{const t=debtStats(d);return `<div class="pastel lavender" style="margin-top:14px"><div class="sectionhead"><strong>💳 ${escapeHTML(d.title)}</strong><span class="pill">${money(t.balance)} remaining</span></div><p class="hint">Starting balance ${money(d.amount)} · Payments ${money(t.paid)} · New purchases/interest/fees ${money(t.charges)}</p><div style="height:12px;background:#fff;border-radius:12px;overflow:hidden"><div style="height:100%;background:#8d71d1;width:${t.progress}%"></div></div><p class="hint">${t.progress.toFixed(0)}% paid</p><div class="toolbar"><button class="btn" onclick="debtPaymentForm('${d.id}')">+ Record Payment</button><button class="btn primary" onclick="debtPurchaseForm('${d.id}')">+ Add Card Purchase</button><button class="btn" onclick="debtChargeForm('${d.id}')">+ Interest / Fee</button><button class="btn" onclick="debtForm('${d.id}')">Edit Debt</button><button class="btn" onclick="debtDelete('${d.id}')">Delete Debt</button></div><details><summary>Payment history (${debtPayments(d.id).length})</summary>${debtPayments(d.id).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="budgetrow"><div>${escapeHTML(r.date)} · ${escapeHTML(r.title)}</div><strong>${money(r.amount)}</strong><button class="smallbtn" onclick="budgetForm('${r.id}')">Edit</button></div>`).join('')||'<p class="hint">No payments yet.</p>'}</details><details><summary>New purchases, interest & fees (${debtCharges(d.id).length})</summary>${debtCharges(d.id).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="budgetrow"><div>${escapeHTML(r.date)} · ${escapeHTML(r.title)} <small>(${r.chargeKind==='purchase'?'Purchase':'Interest / fee'})</small></div><strong>${money(r.amount)}</strong><button class="smallbtn" onclick="debtChargeEdit('${r.id}')">Edit</button><button class="smallbtn" onclick="debtChargeDelete('${r.id}')">Delete</button></div>`).join('')||'<p class="hint">No new charges yet.</p>'}</details></div>`}).join(''):'<p class="emptymsg">Add a debt to start tracking your repayments.</p>'}</section>`}
function budgetHTML(){const rows=budgetRows(),income=rows.filter(r=>r.kind==='income').reduce((s,r)=>s+Number(r.amount||0),0),spent=rows.filter(r=>r.kind==='expense').reduce((s,r)=>s+Number(r.amount||0),0),limits=active().filter(r=>r.type==='budgetlimit'&&r.month===budgetMonth),planned=limits.reduce((s,r)=>s+Number(r.amount||0),0),byCat={};rows.filter(r=>r.kind==='expense').forEach(r=>byCat[r.category]=(byCat[r.category]||0)+Number(r.amount||0));return `<section class="card"><div class="sectionhead"><h2>💰 My Budget Planner</h2><input type="month" value="${budgetMonth}" onchange="budgetMonth=this.value;render()"></div><p class="hint">Amounts in NZD · Saved on this device · Included in backups</p><div class="budgetstats"><div class="budgetstat" style="background:var(--mint)">Income<strong>${money(income)}</strong></div><div class="budgetstat" style="background:var(--pink)">Expenses<strong>${money(spent)}</strong></div><div class="budgetstat" style="background:var(--blue)">Remaining<strong>${money(income-spent)}</strong></div><div class="budgetstat" style="background:var(--peach)">Planned expenses<strong>${money(planned)}</strong></div></div><div class="toolbar"><button class="btn primary" onclick="budgetForm()">+ Add transaction</button><button class="btn" onclick="budgetLimitForm()">+ Set category budget</button></div></section>${debtHTML()}<section class="card"><h2>🌿 Income by Category</h2>${(()=>{const cats={};rows.filter(r=>r.kind==='income').forEach(r=>{const k=r.category||'Other';cats[k]=(cats[k]||0)+Number(r.amount||0)});return Object.keys(cats).length?Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([cat,amount])=>`<div style="padding:12px 0;border-bottom:1px solid var(--border)"><div class="sectionhead"><strong>${escapeHTML(cat)}</strong><strong>${money(amount)}</strong></div><div style="height:10px;border-radius:10px;background:var(--mint);overflow:hidden;margin-top:8px"><div style="height:100%;width:${income?Math.min(100,amount/income*100):0}%;background:#60b89b"></div></div><small class="hint">${income?(amount/income*100).toFixed(1):0}% of total income</small></div>`).join(''):'<p class="emptymsg">Add income transactions to see a category summary.</p>'})()}</section><section class="card"><h2>🌷 Spending by Category</h2>${limits.length||Object.keys(byCat).length?[...new Set([...limits.map(x=>x.category),...Object.keys(byCat)])].map(cat=>{const lim=limits.find(x=>x.category===cat),used=byCat[cat]||0,cap=Number(lim?.amount||0);return `<div style="padding:12px 0;border-bottom:1px solid var(--border)"><div class="sectionhead"><strong>${escapeHTML(cat)}</strong><span>${money(used)} ${lim?' / '+money(cap):''}</span></div>${lim?`<div style="height:10px;border-radius:10px;background:var(--lav);overflow:hidden;margin-top:8px"><div style="height:100%;width:${Math.min(100,cap?used/cap*100:0)}%;background:${used>cap?'#e77987':'#9a79dd'}"></div></div><button class="smallbtn" onclick="budgetLimitForm('${lim.id}')">✏️ Edit planned expense</button> <button class="smallbtn" onclick="deleteBudgetLimit('${lim.id}')">🗑️ Delete</button>`:''}</div>`}).join(''):'<p class="emptymsg">Set a monthly budget or add a transaction to begin.</p>'}</section><section class="card"><div class="sectionhead"><h2>🧾 Transactions</h2><button class="btn primary" onclick="budgetForm()">+ Add</button></div>${rows.length?rows.map(r=>`<div class="budgetrow"><div><strong>${escapeHTML(r.title)}</strong><div class="hint">${escapeHTML(r.date)} · ${escapeHTML(r.category)}${r.debtId?' · 💳 '+escapeHTML(debtList().find(d=>d.id===r.debtId)?.title||'Debt payment'):''}</div></div><strong style="color:${r.kind==='income'?'#287b60':'#b75072'}">${r.kind==='income'?'+':'−'}${money(r.amount)}</strong><div><button class="smallbtn" onclick="budgetForm('${r.id}')">Edit</button><button class="smallbtn" onclick="budgetDelete('${r.id}')">Delete</button></div></div>`).join(''):'<p class="emptymsg">No transactions this month.</p>'}</section>`}
function budgetForm(id,selectedDebtId){const r=id?records.find(x=>x.id===id):null;const debts=debtList(),debtId=r?.debtId||selectedDebtId||'';showCustomForm(r?'Edit Transaction':'Add Transaction',[['title','Description','text',r?.title|| (debtId?'Debt repayment':'')],['kind','Type','select',r?.kind||'expense',[['expense','Expense'],['income','Income']]],['amount','Amount (NZD)','number',r?.amount||''],['category','Category','select',debtId?'Debt Payment':r?.category||'Groceries',[['Groceries','Groceries'],['Bills','Bills'],['Transport','Transport'],['Housing','Housing'],['Tithes','⛪ Tithes'],['Giving','Giving'],['Savings','Savings'],['Shopping','Shopping'],['Health','Health'],['Entertainment','Entertainment'],['Salary','Salary'],['Debt Payment','Debt Payment'],['Other','Other']]],['debtId','Link to debt (optional)','select',debtId,[['','No linked debt'],...debts.map(d=>[d.id,d.title])]],['date','Date','date',r?.date||localDay()]],v=>{if(!v.title.trim()||!v.date||!(Number(v.amount)>0))return alert('Enter a description, date and amount above zero');if(v.debtId&&v.kind!=='expense')return alert('A debt payment must be an expense.');if(v.debtId&&Number(v.amount)>debtStats(debts.find(d=>d.id===v.debtId)).balance+((r?.debtId===v.debtId)?Number(r.amount||0):0)+0.005)return alert('Payment exceeds the remaining debt balance.');saveRecord({...r,id:r?.id||uid(),type:'budget',title:v.title.trim(),kind:v.kind,amount:Number(v.amount),category:v.debtId?'Debt Payment':v.category,debtId:v.debtId||'',date:v.date});closeCustomForm()})}

function debtChargeForm(id){showCustomForm('Add Interest or Fee',[['title','Description','text','Interest / fee'],['amount','Amount (NZD)','number',''],['date','Date','date',localDay()]],v=>{if(!v.title.trim()||!v.date||!(Number(v.amount)>0))return alert('Enter a description, date and amount above zero');saveRecord({id:uid(),type:'debtcharge',debtId:id,title:v.title.trim(),amount:Number(v.amount),date:v.date});closeCustomForm()})}

function debtChargeDelete(id){const r=records.find(x=>x.id===id&&x.type==='debtcharge'&&!x.deleted);if(!r||!confirm('Delete this credit card charge?'))return;r.deleted=true;saveRecord(r)}
function debtDelete(id){if(debtPayments(id).length||debtCharges(id).length){alert('This debt has payment or charge history. Remove those entries first to avoid losing their link.');return}if(!confirm('Delete this debt?'))return;const r=records.find(x=>x.id===id);if(r){r.deleted=true;saveRecord(r)}}
function budgetLimitForm(id){const r=id?records.find(x=>x.id===id):null;showCustomForm(r?'Edit Category Budget':'Category Budget',[['category','Category','select',r?.category||'Groceries',[['Groceries','Groceries'],['Bills','Bills'],['Transport','Transport'],['Housing','Housing'],['Tithes','⛪ Tithes'],['Giving','Giving'],['Savings','Savings'],['Shopping','Shopping'],['Health','Health'],['Entertainment','Entertainment'],['Other','Other']]],['amount','Monthly budget (NZD)','number',r?.amount||'']],v=>{if(!(Number(v.amount)>0))return alert('Enter a budget greater than zero');const old=r||active().find(x=>x.type==='budgetlimit'&&x.month===budgetMonth&&x.category===v.category);saveRecord({...old,id:old?.id||uid(),type:'budgetlimit',month:budgetMonth,category:v.category,amount:Number(v.amount)});closeCustomForm()})}
function deleteBudgetLimit(id){const r=records.find(x=>x.id===id&&x.type==='budgetlimit'&&!x.deleted);if(!r||!confirm('Delete this planned expense for '+r.category+'?'))return;r.deleted=true;saveRecord(r)}
function budgetDelete(id){if(!confirm('Delete this transaction?'))return;const r=records.find(x=>x.id===id);if(r){r.deleted=true;saveRecord(r)}}

function mergeRecords(remote){const map=new Map(records.map(r=>[r.id,r]));remote.forEach(r=>{if(!r?.id)return;let old=map.get(r.id);if(!old||String(r.updatedAt||'')>String(old.updatedAt||''))map.set(r.id,r)});records=[...map.values()];localStorage.setItem(KEY,JSON.stringify(records));render()}
function exportBackup(){
  const payload={app:'My Digital Planner',version:1,exportedAt:new Date().toISOString(),records};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='My_Digital_Planner_Backup_'+localDay()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  status('Backup downloaded • keep it somewhere private');
}
async function restoreBackup(event){
  const file=event.target.files?.[0];event.target.value='';if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=='My Digital Planner'||!Array.isArray(data.records))throw Error('Not a valid planner backup');
    if(!data.records.every(r=>r&&typeof r.id==='string'&&typeof r.type==='string'))throw Error('Backup contains invalid entries');
    if(!confirm('Restore this backup? Entries with the same ID will use the newer version. Please back up this device first.'))return;
    mergeRecords(data.records);
    status('✓ Backup restored • '+data.records.length+' entries checked');
  }catch(err){alert('Could not restore backup: '+err.message)}
}

/* Cloud sync adapter — local-first; manual sync avoids silent overwrites. */
const PLANNER_SYNC_URL = 'https://script.google.com/macros/s/AKfycbySmNKKDngCU8dqgGy2CdhcY4ig5eqUZOc9ZWGYu4R_-RcrA-EyGUjnwNxEuAWkr9xf/exec';
const PLANNER_TOKEN_KEY = 'my_planner_cloud_token';
function plannerToken(){return localStorage.getItem(PLANNER_TOKEN_KEY)||''}
async function plannerRequest(payload){
  const response=await fetch(PLANNER_SYNC_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload),redirect:'follow'});
  if(!response.ok)throw Error('Server returned '+response.status);
  const raw=await response.text();
  let data;try{data=JSON.parse(raw)}catch(e){throw Error('The web app did not return readable JSON. Check deployment permissions and endpoint.')}
  if(data.success===false||data.error)throw Error(data.error||data.message||'Sync request rejected');
  return data;
}
async function plannerConnect(){
  const key=prompt('Enter your planner security key (not your Google password):');
  if(key===null)return;
  if(!key.trim())return alert('A security key is required.');
  try{
    status('Authorising device…');
    const result=await plannerRequest({action:'authorize',securityKey:key.trim()});
    const token=result.token||result.deviceToken||result.data?.token;
    if(!token)throw Error('Authorisation did not return a device token.');
    localStorage.setItem(PLANNER_TOKEN_KEY,token);
    status('✓ Device connected • automatic sync enabled');plannerQueueAutoSync();
  }catch(e){status('Connection failed');alert('Could not connect: '+e.message)}
}
/* Large handwriting is stored separately in Drive; local pages keep full strokes. */
const PLANNER_SHEET_LIMIT=45000;
function plannerSheetRecord(r){
  if(JSON.stringify(r).length<=PLANNER_SHEET_LIMIT)return r;
  if(r.type!=='bookpage'||!Array.isArray(r.strokes)||!r.strokes.length)
    throw Error('An oversized record cannot be separated safely: '+r.type+' ('+r.id+').');
  const small={...r,strokes:[],handwritingInDrive:true};
  if(JSON.stringify(small).length>PLANNER_SHEET_LIMIT)
    throw Error('Notebook page metadata is too large: '+r.id);
  return small;
}
async function plannerRestoreCloudInk(remote){
  const hydrated=[];
  for(const r of remote){
    if(r.type==='bookpage'&&r.handwritingInDrive){
      const local=records.find(x=>x.id===r.id);
      // Never replace newer locally edited handwriting with a cloud copy.
      if(local&&Array.isArray(local.strokes)&&local.strokes.length&&
          String(local.updatedAt||'')>=String(r.updatedAt||'')){
        hydrated.push({...r,strokes:local.strokes});continue;
      }
      status('Downloading handwriting…');
      const response=await plannerRequest({action:'downloadHandwriting',token:plannerToken(),recordId:r.id});
      const strokes=response.inkData??response.data?.inkData;
      if(!Array.isArray(strokes))throw Error('Handwriting missing in Drive for page '+r.id+'. Local data unchanged.');
      hydrated.push({...r,strokes});
    }else hydrated.push(r);
  }
  return hydrated;
}
async function plannerRefresh(){
  if(!plannerToken())return alert('Please tap Connect Device first.');
  try{
    status('Refreshing cloud records…');
    const result=await plannerRequest({action:'pull',token:plannerToken()});
    const remote=result.records||result.data?.records;
    if(!Array.isArray(remote)||!remote.every(r=>r&&typeof r.id==='string'))throw Error('Invalid cloud records.');
    const full=await plannerRestoreCloudInk(remote);
    mergeRecords(full);
    status('✓ Refreshed '+remote.length+' cloud records • local changes preserved');
  }catch(e){status('Refresh failed • local records unchanged');alert('Refresh failed: '+e.message)}
}
async function plannerSyncNow(options={}){
  const automatic=options.automatic===true;
  if(!plannerToken()){if(!automatic)alert('Please tap Connect Device first.');return false;}
  if(plannerSyncBusy){plannerSyncAgain=true;return false;}
  plannerSyncBusy=true;
  try{
    status('Checking cloud before upload…');
    const pulled=await plannerRequest({action:'pull',token:plannerToken()});
    const cloud=pulled.records||pulled.data?.records;
    if(!Array.isArray(cloud)||!cloud.every(r=>r&&typeof r.id==='string'))throw Error('Could not verify cloud records. Nothing uploaded.');
    const hydrated=await plannerRestoreCloudInk(cloud);
    mergeRecords(hydrated);
    const prepared=records.map(plannerSheetRecord);
    // Upload handwriting first. If any upload fails, do not publish incomplete pages.
    for(let i=0;i<records.length;i++){
      if(prepared[i].handwritingInDrive){
        status('Uploading handwriting '+(i+1)+' of '+records.length+'…');
        const answer=await plannerRequest({action:'uploadHandwriting',token:plannerToken(),recordId:records[i].id,inkData:records[i].strokes});
        if(answer.success===false)throw Error('Handwriting upload failed for '+records[i].id);
      }
    }
    let saved=0;
    for(let i=0;i<prepared.length;i+=50){
      const batch=prepared.slice(i,i+50);
      status('Uploading '+Math.min(i+batch.length,prepared.length)+' of '+prepared.length+'…');
      await plannerRequest({action:'push',token:plannerToken(),records:batch});
      saved+=batch.length;
    }
    status('✓ Cloud sync completed • '+saved+' entries sent');
    plannerLastSync=Date.now();return true;
  }catch(e){status('Sync failed • local records retained');if(!automatic)alert('Sync failed: '+e.message);else console.warn('Automatic planner sync:',e);return false;}
  finally{plannerSyncBusy=false;if(plannerSyncAgain){plannerSyncAgain=false;plannerQueueAutoSync();}}
}

/* Automatic sync: local-first, debounced, and serialized. Runs only while the app is active. */
let plannerSyncTimer=null,plannerSyncBusy=false,plannerSyncAgain=false,plannerLastSync=0;
function plannerQueueAutoSync(){
  if(!plannerToken())return;
  clearTimeout(plannerSyncTimer);
  plannerSyncTimer=setTimeout(()=>{
    if(document.visibilityState==='visible'&&navigator.onLine)plannerSyncNow({automatic:true});
  },3500);
}
function plannerResumeSync(){
  if(!plannerToken()||!navigator.onLine)return;
  if(document.visibilityState==='visible')plannerQueueAutoSync();
}
window.addEventListener('online',plannerResumeSync);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)plannerResumeSync();});
window.addEventListener('focus',plannerResumeSync);
// Check for updates while the app stays open, without running background timers.
setInterval(()=>{
  if(!document.hidden&&plannerToken()&&navigator.onLine&&Date.now()-plannerLastSync>120000)plannerQueueAutoSync();
},120000);
load();render();
</script><script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(error => console.warn('Offline app setup:', error));
  });
}
</script>
