:root{--ink:#3c3456;--muted:#817c91;--paper:#fffefa;--lav:#eee6ff;--pink:#ffe3ed;--blue:#e1f3ff;--mint:#e0f5e8;--peach:#ffe9d5;--border:#e7dff1}*{box-sizing:border-box}body{margin:0;background:#f7f2fc;color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.shell{max-width:1100px;margin:auto;padding:18px}.header{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}.brand{font-size:clamp(25px,4vw,38px);font-weight:800;letter-spacing:-1px}.subtitle{color:var(--muted);font-size:13px}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.btn{border:1px solid var(--border);border-radius:14px;padding:10px 14px;background:white;color:var(--ink);font-weight:650}.btn.primary{background:#7252bd;color:white;border-color:#7252bd}.btn:disabled{opacity:.55}.nav{display:flex;gap:8px;overflow:auto;padding-bottom:6px}.nav .btn.active{background:var(--lav);border-color:#bca5f2}.card{background:var(--paper);border:1px solid var(--border);border-radius:22px;box-shadow:0 8px 30px #5843830d;padding:20px;margin:16px 0}.sectionhead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.sectionhead h2{margin:0;font-size:23px}.datebar{display:flex;align-items:center;gap:9px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:7px;margin-top:15px}.weekday{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:7px 0}.day{min-height:83px;text-align:left;background:white;border:1px solid var(--border);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;color:var(--ink)}.day.today{border:2px solid #ad89f4}.day.selected{background:#eee6ff}.day.empty{visibility:hidden}.dot{display:inline-block;border-radius:50%;width:7px;height:7px;background:#ad89f4;margin-right:3px}.count{font-size:10px;color:var(--muted)}.entry{padding:12px 14px;border-radius:14px;background:#f9f6ff;border:1px solid var(--border);margin-top:9px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.entry small{color:var(--muted)}.entry.done{opacity:.55}.entry.done .entrytitle{text-decoration:line-through}.tag{font-size:11px;border-radius:9px;padding:3px 7px;background:var(--pink);display:inline-block;margin-left:5px}.fields{display:grid;gap:12px}.fields label{display:grid;gap:5px;font-size:13px;font-weight:700}.fields input,.fields textarea,.fields select{border:1px solid #d9cfe9;background:white;border-radius:12px;padding:12px;width:100%;color:var(--ink)}.fields textarea{min-height:105px;resize:vertical}.twocol{display:grid;grid-template-columns:1fr 1fr;gap:14px}.paper{background:repeating-linear-gradient(to bottom,#fffefa 0,#fffefa 31px,#e9dff3 32px);border:1px solid var(--border);border-radius:16px;overflow:hidden;touch-action:none}.paper canvas{display:block;width:100%;height:460px;touch-action:none}.inktools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}.swatch{width:30px;height:30px;border:2px solid white;outline:1px solid #d9cfe9;border-radius:50%}.swatch.active{outline:3px solid #a987ec}.hint{color:var(--muted);font-size:13px}.status{font-size:12px;color:var(--muted)}.pill{background:var(--mint);border-radius:100px;padding:6px 10px;font-size:12px}.gridcards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.mini{border-radius:17px;padding:15px;background:var(--pink)}.mini:nth-child(2){background:var(--mint)}.mini:nth-child(3){background:var(--blue)}.mini strong{font-size:24px;display:block}.emptymsg{color:var(--muted);padding:18px 0}.weekrow{display:grid;grid-template-columns:90px 1fr;gap:12px;border-bottom:1px solid var(--border);padding:10px 0}.weekrow:last-child{border:0}.smallbtn{background:none;border:0;color:#7755b4;padding:4px;font-weight:700}.modalback{position:fixed;inset:0;background:#29203888;display:flex;align-items:center;justify-content:center;padding:12px;z-index:5}.modal{width:min(540px,100%);max-height:92vh;overflow:auto;background:white;border-radius:22px;padding:23px}.hidden{display:none!important}@media(max-width:640px){.shell{padding:12px}.card{padding:14px}.day{min-height:67px;padding:5px;font-size:12px}.calendar{gap:4px}.twocol{grid-template-columns:1fr}.gridcards{gap:6px}.mini{padding:10px}.mini strong{font-size:19px}.brand{font-size:27px}.weekrow{grid-template-columns:66px 1fr}}

.bookgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:15px;margin-top:18px}

</style></head><body><main class="shell"><header class="header"><div><div class="brand">🌷 My Digital Planner</div><div class="subtitle">A little space for every beautiful day ✨</div></div><span class="pill">🌷 Personal planner</span></header><div class="toolbar"><button class="btn primary" onclick="exportBackup()">⬇️ Backup Planner</button><button class="btn" onclick="document.getElementById('restoreFile').click()">⬆️ Restore Backup</button><input id="restoreFile" type="file" accept="application/json,.json" style="display:none" onchange="restoreBackup(event)"><span class="status" id="status">Saved on this device • use Backup to transfer</span></div><nav class="nav" id="nav"></nav><section id="content"></section></main><div id="modalback" class="modalback hidden"><div class="modal"><div class="sectionhead"><h2 id="modalTitle">New entry</h2><button class="btn" onclick="closeModal()">✕</button></div><div class="fields" style="margin-top:16px"><label>Type<select id="eType"><option value="task">Task</option><option value="appointment">Appointment</option><option value="journal">Journal</option><option value="note">Note</option></select></label><label>Title<input id="eTitle" placeholder="What would you like to remember?"></label><label>Date<input type="date" id="eDate"></label><label>Time (optional)<input type="time" id="eTime"></label><label>Details<textarea id="eBody" placeholder="Write your thoughts here..."></textarea></label><button class="btn primary" onclick="saveEntry()">💜 Save entry</button></div></div></div><script>
const KEY='my_digital_planner_private_v1';let records=[],view='month',chosen=localDay(),cursor=new Date(chosen+'T12:00:00'),editing=null,inkTool='pen',inkColor='#6147a8',inkWidth=3,drawing=false,currentStroke=null,inkStrokes=[],bookId=null,pageId=null,inkDirty=false,budgetMonth=localDay().slice(0,7);
function localDay(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function dateObj(s){return new Date(s+'T12:00:00')}function uid(){return 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,10)}
function load(){try{records=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(records))records=[]}catch(e){records=[]}}function persist(){localStorage.setItem(KEY,JSON.stringify(records));status('Saved on this device • make a backup regularly')}
function status(s){document.getElementById('status').textContent=s}function active(){return records.filter(r=>!r.deleted)}function onDay(d){return active().filter(r=>r.date===d&&r.type!=='ink').sort((a,b)=>(a.time||'').localeCompare(b.time||''))}
function saveRecord(r){r.updatedAt=new Date().toISOString();const i=records.findIndex(x=>x.id===r.id);if(i<0)records.push(r);else records[i]=r;persist();render()}
function render(){const tabs=[['month','📅 Month'],['week','🗓️ Week'],['day','☀️ Day'],['tasks','✅ Tasks'],['journal','📖 Journal'],['notebook','✍️ Notebook'],['budget','💰 Budget']];document.getElementById('nav').innerHTML=tabs.map(([v,n])=>`<button class="btn ${v===view?'active':''}" onclick="setView('${v}')">${n}</button>`).join('');const c=document.getElementById('content');c.innerHTML=view==='month'?monthHTML():view==='week'?weekHTML():view==='day'?dayHTML():view==='tasks'?listHTML('task','My Tasks'):view==='journal'?listHTML('journal','My Journal'):view==='budget'?budgetHTML():notebookHTML();if(view==='notebook'&&pageId)initInk()}
function setView(v){if(!confirmLeaveInk())return;view=v;render()}function shiftMonth(n){cursor=new Date(cursor.getFullYear(),cursor.getMonth()+n,15);render()}function shiftDay(n){chosen=localDay(new Date(dateObj(chosen).getTime()+n*86400000));cursor=dateObj(chosen);render()}function choose(d,v='day'){chosen=d;cursor=dateObj(d);view=v;render()}
function monthHTML(){const y=cursor.getFullYear(),m=cursor.getMonth(),start=new Date(y,m,1).getDay(),count=new Date(y,m+1,0).getDate();let cells=Array.from({length:start},()=>'<div class="day empty"></div>');for(let n=1;n<=count;n++){let d=localDay(new Date(y,m,n)),items=onDay(d);cells.push(`<button class="day ${d===localDay()?'today':''} ${d===chosen?'selected':''}" onclick="choose('${d}')"><strong>${n}</strong><span class="count">${items.slice(0,3).map(x=>'<span class="dot"></span>').join('')} ${items.length?items.length+' planned':''}</span></button>`)}return `<div class="card"><div class="sectionhead"><h2>🌸 ${cursor.toLocaleString(undefined,{month:'long',year:'numeric'})}</h2><div class="datebar"><button class="btn" onclick="shiftMonth(-1)">‹</button><button class="btn" onclick="shiftMonth(1)">›</button><button class="btn primary" onclick="openModal()">+ Add</button></div></div><div class="calendar">${['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].map(d=>`<div class="weekday">${d}</div>`).join('')}${cells.join('')}</div></div><div class="card"><div class="sectionhead"><h2>For ${dateObj(chosen).toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2><button class="btn" onclick="choose('${chosen}')">Open day →</button></div>${entryList(onDay(chosen))}</div>`}
function weekStart(){let d=dateObj(chosen);d.setDate(d.getDate()-d.getDay());return d}function weekHTML(){let s=weekStart();return `<div class="card"><div class="sectionhead"><h2>🗓️ This Week</h2><button class="btn primary" onclick="openModal()">+ Add</button></div>${Array.from({length:7},(_,i)=>{let d=new Date(s);d.setDate(d.getDate()+i);let key=localDay(d);return `<div class="weekrow"><button class="smallbtn" onclick="choose('${key}')">${d.toLocaleDateString(undefined,{weekday:'short'})}<br>${d.getDate()}</button><div>${entryList(onDay(key))}</div></div>`}).join('')}</div>`}
function dayHTML(){let d=dateObj(chosen),items=onDay(chosen);return `<div class="card"><div class="sectionhead"><div><div class="subtitle">YOUR DAILY PAGE</div><h2>☀️ ${d.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'})}</h2></div><div class="datebar"><button class="btn" onclick="shiftDay(-1)">‹</button><button class="btn" onclick="shiftDay(1)">›</button></div></div><div class="gridcards" style="margin-top:18px"><div class="mini"><strong>${items.filter(x=>x.type==='task'&&!x.done).length}</strong>To do</div><div class="mini"><strong>${items.filter(x=>x.type==='appointment').length}</strong>Appointments</div><div class="mini"><strong>${items.filter(x=>x.type==='journal').length}</strong>Journal entries</div></div><div class="sectionhead" style="margin-top:22px"><h2>Today's Plans</h2><button class="btn primary" onclick="openModal()">+ Add Entry</button></div>${entryList(items)}</div><div class="card"><div class="sectionhead"><h2>✍️ Handwriting for today</h2><button class="btn" onclick="setView('notebook')">Open notebook →</button></div><p class="hint">Write with your Apple Pencil or finger on a separate lined notebook page.</p></div>`}
function escapeHTML(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function entryList(items){if(!items.length)return '<p class="emptymsg">Nothing here yet. Add something lovely! 🌷</p>';return items.map(r=>`<div class="entry ${r.done?'done':''}"><div>${r.type==='task'?`<input type="checkbox" ${r.done?'checked':''} onchange="toggleDone('${r.id}')" aria-label="Complete task">`:''}<strong class="entrytitle">${escapeHTML(r.title)}</strong><span class="tag">${escapeHTML(r.type)}</span><div><small>${escapeHTML(r.time||'')}${r.body?' · '+escapeHTML(r.body).slice(0,150):''}</small></div></div><div><button class="smallbtn" onclick="openModal('${r.id}')">Edit</button><button class="smallbtn" onclick="removeEntry('${r.id}')">Delete</button></div></div>`).join('')}
function listHTML(type,title){let items=active().filter(x=>x.type===type).sort((a,b)=>(b.date||'').localeCompare(a.date||''));return `<div class="card"><div class="sectionhead"><h2>${title}</h2><button class="btn primary" onclick="openModal(null,'${type}')">+ Add</button></div>${entryList(items)}</div>`}
function openModal(id=null,type='task'){editing=id;let r=id?records.find(x=>x.id===id):null;document.getElementById('modalTitle').textContent=r?'Edit Entry':'New Entry';document.getElementById('eType').value=r?.type||type;document.getElementById('eTitle').value=r?.title||'';document.getElementById('eDate').value=r?.date||chosen;document.getElementById('eTime').value=r?.time||'';document.getElementById('eBody').value=r?.body||'';document.getElementById('modalback').classList.remove('hidden')}
function closeModal(){document.getElementById('modalback').classList.add('hidden')}
function saveEntry(){const title=document.getElementById('eTitle').value.trim();if(!title){alert('Please enter a title.');return}const r=editing?{...records.find(x=>x.id===editing)}:{id:uid(),done:false};Object.assign(r,{type:document.getElementById('eType').value,title,date:document.getElementById('eDate').value||chosen,time:document.getElementById('eTime').value,body:document.getElementById('eBody').value});saveRecord(r);closeModal()}
function toggleDone(id){let r=records.find(x=>x.id===id);if(r){r.done=!r.done;saveRecord(r)}}function removeEntry(id){if(!confirm('Delete this entry?'))return;let r=records.find(x=>x.id===id);if(r){r.deleted=true;saveRecord(r)}}
function confirmLeaveInk(){return !inkDirty||confirm('You have unsaved handwriting. Leave without saving?')}
function notebooks(){return active().filter(r=>r.type==='book')}
function bookPages(id){return active().filter(r=>r.type==='bookpage'&&r.bookId===id).sort((a,b)=>(a.order||0)-(b.order||0))}
function currentPage(){return records.find(r=>r.id===pageId&&r.type==='bookpage'&&!r.deleted)}
function inkRecord(){return currentPage()}
function showBook(id){if(!confirmLeaveInk())return;bookId=id;pageId=null;inkDirty=false;render()}
function openPage(id){if(!confirmLeaveInk())return;pageId=id;inkDirty=false;render()}
function openNotebookLibrary(){if(!confirmLeaveInk())return;bookId=null;pageId=null;inkDirty=false;render()}
function notebookHTML(){
 if(!bookId){const books=notebooks();return `<section class="card"><div class="sectionhead"><h2>📚 My Notebook Collection</h2><button class="btn primary" onclick="bookForm()">+ Create Notebook</button></div><p class="hint">Choose a cover and create as many handwritten notebooks as you like.</p><div class="bookgrid">${books.map(b=>`<button class="bookcover" style="background:${b.cover||'#eee6ff'}" onclick="showBook('${b.id}')"><span style="font-size:27px">📖</span><strong>${escapeHTML(b.title)}</strong><small>${bookPages(b.id).length} pages</small></button>`).join('')}</div>${!books.length?'<p class="emptymsg">Your notebook shelf is empty. Create your first notebook! 🌷</p>':''}</section>`}
 const book=records.find(r=>r.id===bookId&&!r.deleted);if(!book){bookId=null;return notebookHTML()}
 if(!pageId){const pages=bookPages(bookId);return `<section class="card"><button class="btn" onclick="openNotebookLibrary()">← My notebooks</button><div class="sectionhead" style="margin-top:15px"><h2>📖 ${escapeHTML(book.title)}</h2><div><button class="btn" onclick="bookForm('${book.id}')">Edit cover</button> <button class="btn primary" onclick="pageForm()">+ New Page</button></div></div><div class="bookgrid">${pages.map((p,i)=>`<button class="bookcover" style="background:${book.cover||'#eee6ff'}" onclick="openPage('${p.id}')"><span>📄 Page ${i+1}</span><strong>${escapeHTML(p.title||'Untitled page')}</strong><small>${escapeHTML(p.paper||'lined')} paper</small></button>`).join('')}</div>${!pages.length?'<p class="emptymsg">Add your first page to start writing.</p>':''}</section>`}
 const page=currentPage();if(!page){pageId=null;return notebookHTML()}
 const pages=bookPages(bookId),index=pages.findIndex(p=>p.id===pageId);
 return `<section class="card"><button class="btn" onclick="showBook('${bookId}')">← ${escapeHTML(book.title)}</button><div class="sectionhead" style="margin-top:15px"><div><h2>✍️ ${escapeHTML(page.title)}</h2><p class="hint">Page ${index+1} of ${pages.length} · ${escapeHTML(page.paper||'lined')} paper</p></div><div><button class="btn" onclick="pageForm('${page.id}')">Edit title</button> <button class="btn" onclick="deletePage()">Delete page</button></div></div><div class="inktools"><button class="btn" id="penbtn" onclick="setInkTool('pen')">✒️ Pen</button><button class="btn" id="erasebtn" onclick="setInkTool('eraser')">◻ Eraser</button>${['#6147a8','#e95d92','#2081ab','#2b946f','#222222'].map(c=>`<button class="swatch ${c===inkColor?'active':''}" style="background:${c}" onclick="setInkColor('${c}')" aria-label="Ink colour"></button>`).join('')}<label class="hint">Width <input type="range" min="1" max="14" value="${inkWidth}" oninput="inkWidth=Number(this.value)"></label></div><div class="paper ${page.paper==='dotted'?'dotted':page.paper==='grid'?'gridpaper':page.paper==='blank'?'blank':''}"><canvas id="inkcanvas"></canvas></div><div class="toolbar"><button class="btn primary" onclick="saveInk()">💾 Save handwriting</button><button class="btn" onclick="undoInk()">↶ Undo</button><button class="btn" onclick="clearInk()">Clear page</button><button class="btn" onclick="pageNavigate(-1)" ${index===0?'disabled':''}>← Previous</button><button class="btn" onclick="pageNavigate(1)" ${index===pages.length-1?'disabled':''}>Next →</button></div><p class="hint">Save before leaving this page. Pages and notebooks are included in your private backup.</p></section>`
}
function pageNavigate(n){const pages=bookPages(bookId),i=pages.findIndex(p=>p.id===pageId)+n;if(pages[i])openPage(pages[i].id)}
function bookForm(id){const b=id?records.find(r=>r.id===id):null;showCustomForm(b?'Edit Notebook':'New Notebook',[['title','Notebook name','text',b?.title||''],['cover','Cover colour','select',b?.cover||'#ffe3ed',[['#ffe3ed','Pink'],['#eee6ff','Lavender'],['#e1f3ff','Sky Blue'],['#e0f5e8','Mint'],['#ffe9d5','Peach'],['#fff3b9','Yellow']]]],values=>{if(!values.title.trim())return alert('Enter a notebook name');saveRecord({...b,id:b?.id||uid(),type:'book',title:values.title.trim(),cover:values.cover});closeCustomForm()})}
function pageForm(id){const p=id?records.find(r=>r.id===id):null;showCustomForm(p?'Edit Page':'New Page',[['title','Page title','text',p?.title||''],['paper','Paper style','select',p?.paper||'lined',[['lined','Lined'],['dotted','Dotted'],['grid','Grid'],['blank','Blank']]]],values=>{if(!values.title.trim())return alert('Enter a page title');const r={...p,id:p?.id||uid(),type:'bookpage',bookId:bookId,title:values.title.trim(),paper:values.paper,order:p?.order??bookPages(bookId).length,strokes:p?.strokes||[]};saveRecord(r);pageId=r.id;inkDirty=false;closeCustomForm();render()})}
function deletePage(){if(!confirm('Delete this page and its handwriting?'))return;const p=currentPage();if(p){p.deleted=true;saveRecord(p);pageId=null;inkDirty=false;render()}}
function showCustomForm(title,fields,callback){const back=document.createElement('div');back.className='modalback';back.id='customFormBack';back.innerHTML=`<div class="modal"><div class="sectionhead"><h2>${escapeHTML(title)}</h2><button class="btn" id="customClose">✕</button></div><form id="customForm" class="fields" style="margin-top:16px">${fields.map(([key,label,type,value,options])=>`<label>${escapeHTML(label)}${type==='select'?`<select name="${key}">${options.map(([v,t])=>`<option value="${escapeHTML(v)}" ${v===value?'selected':''}>${escapeHTML(t)}</option>`).join('')}</select>`:`<input name="${key}" type="${type}" value="${escapeHTML(value)}" ${type==='number'?'step="0.01" min="0"':''}>`}</label>`).join('')}<button class="btn primary" type="submit">💜 Save</button></form></div>`;document.body.appendChild(back);back.querySelector('#customClose').onclick=closeCustomForm;back.querySelector('form').onsubmit=e=>{e.preventDefault();callback(Object.fromEntries(new FormData(e.target)))} }
function closeCustomForm(){document.getElementById('customFormBack')?.remove()}
function setInkTool(t){inkTool=t;document.getElementById('penbtn').style.background=t==='pen'?'#eee6ff':'';document.getElementById('erasebtn').style.background=t==='eraser'?'#eee6ff':''}function setInkColor(c){inkColor=c;inkTool='pen';const el=document.getElementById('inkcanvas');if(el)setInkTool('pen');document.querySelectorAll('.swatch').forEach(b=>b.classList.toggle('active',b.style.backgroundColor===c))}
function initInk(){const c=document.getElementById('inkcanvas');c.width=1000;c.height=600;inkStrokes=JSON.parse(JSON.stringify(inkRecord()?.strokes||[]));c.addEventListener('pointerdown',pointerDown);c.addEventListener('pointermove',pointerMove);c.addEventListener('pointerup',pointerUp);c.addEventListener('pointercancel',pointerUp);setInkTool(inkTool);paintInk()}
function point(e){const r=e.currentTarget.getBoundingClientRect();return {x:Math.round((e.clientX-r.left)*1000/r.width),y:Math.round((e.clientY-r.top)*600/r.height)}}function pointerDown(e){e.preventDefault();e.currentTarget.setPointerCapture(e.pointerId);drawing=true;const p=point(e);if(inkTool==='eraser'){eraseAt(p);return}currentStroke={color:inkColor,width:inkWidth,points:[p]};inkStrokes.push(currentStroke);inkDirty=true;paintInk()}function pointerMove(e){if(!drawing)return;e.preventDefault();const p=point(e);if(inkTool==='eraser'){inkDirty=true;eraseAt(p)}else if(currentStroke){currentStroke.points.push(p);paintInk()}}function pointerUp(){drawing=false;currentStroke=null}
function eraseAt(p){inkStrokes=inkStrokes.filter(s=>!s.points.some(q=>Math.hypot(q.x-p.x,q.y-p.y)<20));paintInk()}
function paintInk(){const c=document.getElementById('inkcanvas');if(!c)return;const ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);inkStrokes.forEach(s=>{if(!s.points?.length)return;ctx.beginPath();ctx.strokeStyle=s.color;ctx.lineWidth=s.width*2;ctx.lineCap='round';ctx.lineJoin='round';ctx.moveTo(s.points[0].x,s.points[0].y);if(s.points.length===1){ctx.lineTo(s.points[0].x+.1,s.points[0].y+.1)}else s.points.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));ctx.stroke()})}
function undoInk(){inkStrokes.pop();inkDirty=true;paintInk()}function clearInk(){if(confirm('Clear all handwriting on this page?')){inkStrokes=[];inkDirty=true;paintInk()}}
function saveInk(){const old=inkRecord();if(!old)return;const r={...old,strokes:JSON.parse(JSON.stringify(inkStrokes))};if(JSON.stringify(r).length>40000){alert('This handwriting page is too large to sync. Please shorten the page.');return}saveRecord(r);inkDirty=false;status('Handwriting saved on this device • make a backup to transfer')}

function money(n){return new Intl.NumberFormat('en-NZ',{style:'currency',currency:'NZD'}).format(Number(n)||0)}
function budgetRows(){return active().filter(r=>r.type==='budget'&&r.date?.slice(0,7)===budgetMonth).sort((a,b)=>b.date.localeCompare(a.date))}
function debtList(){return active().filter(r=>r.type==='debt').sort((a,b)=>a.title.localeCompare(b.title))}
function debtPayments(id){return active().filter(r=>r.type==='budget'&&r.kind==='expense'&&r.debtId===id)}
function debtCharges(id){return active().filter(r=>r.type==='debtcharge'&&r.debtId===id)}
function debtStats(debt){const paid=debtPayments(debt.id).reduce((s,r)=>s+Number(r.amount||0),0),charges=debtCharges(debt.id).reduce((s,r)=>s+Number(r.amount||0),0),total=Number(debt.amount||0)+charges;return {paid,charges,total,balance:Math.max(0,total-paid),progress:total>0?Math.min(100,paid/total*100):100}}
function debtHTML(){const debts=debtList();const outstanding=debts.reduce((s,d)=>s+debtStats(d).balance,0);return `<section class="card"><div class="sectionhead"><h2>💳 My Debt Tracker</h2><button class="btn primary" onclick="debtForm()">+ Add Debt</button></div><p class="hint">Debt payments are recorded as expenses once, then automatically deducted from the linked debt. Interest and fees can be added separately.</p><div class="budgetstats"><div class="budgetstat" style="background:var(--peach)">Total still owed<strong>${money(outstanding)}</strong></div><div class="budgetstat" style="background:var(--mint)">Total payments<strong>${money(debts.reduce((s,d)=>s+debtStats(d).paid,0))}</strong></div></div>${debts.length?debts.map(d=>{const t=debtStats(d);return `<div class="pastel lavender" style="margin-top:14px"><div class="sectionhead"><strong>💳 ${escapeHTML(d.title)}</strong><span class="pill">${money(t.balance)} remaining</span></div><p class="hint">Starting balance ${money(d.amount)} · Payments ${money(t.paid)} · Added interest/fees ${money(t.charges)}</p><div style="height:12px;background:#fff;border-radius:12px;overflow:hidden"><div style="height:100%;background:#8d71d1;width:${t.progress}%"></div></div><p class="hint">${t.progress.toFixed(0)}% paid</p><div class="toolbar"><button class="btn" onclick="debtPaymentForm('${d.id}')">+ Record Payment</button><button class="btn" onclick="debtChargeForm('${d.id}')">+ Interest / Fee</button><button class="btn" onclick="debtForm('${d.id}')">Edit Debt</button><button class="btn" onclick="debtDelete('${d.id}')">Delete Debt</button></div><details><summary>Payment history (${debtPayments(d.id).length})</summary>${debtPayments(d.id).sort((a,b)=>b.date.localeCompare(a.date)).map(r=>`<div class="budgetrow"><div>${escapeHTML(r.date)} · ${escapeHTML(r.title)}</div><strong>${money(r.amount)}</strong><button class="smallbtn" onclick="budgetForm('${r.id}')">Edit</button></div>`).join('')||'<p class="hint">No payments yet.</p>'}</details></div>`}).join(''):'<p class="emptymsg">Add a debt to start tracking your repayments.</p>'}</section>`}
function budgetHTML(){const rows=budgetRows(),income=rows.filter(r=>r.kind==='income').reduce((s,r)=>s+Number(r.amount||0),0),spent=rows.filter(r=>r.kind==='expense').reduce((s,r)=>s+Number(r.amount||0),0),limits=active().filter(r=>r.type==='budgetlimit'&&r.month===budgetMonth),planned=limits.reduce((s,r)=>s+Number(r.amount||0),0),byCat={};rows.filter(r=>r.kind==='expense').forEach(r=>byCat[r.category]=(byCat[r.category]||0)+Number(r.amount||0));return `<section class="card"><div class="sectionhead"><h2>💰 My Budget Planner</h2><input type="month" value="${budgetMonth}" onchange="budgetMonth=this.value;render()"></div><p class="hint">Amounts in NZD · Saved on this device · Included in backups</p><div class="budgetstats"><div class="budgetstat" style="background:var(--mint)">Income<strong>${money(income)}</strong></div><div class="budgetstat" style="background:var(--pink)">Expenses<strong>${money(spent)}</strong></div><div class="budgetstat" style="background:var(--blue)">Remaining<strong>${money(income-spent)}</strong></div><div class="budgetstat" style="background:var(--peach)">Planned expenses<strong>${money(planned)}</strong></div></div><div class="toolbar"><button class="btn primary" onclick="budgetForm()">+ Add transaction</button><button class="btn" onclick="budgetLimitForm()">+ Set category budget</button></div></section>${debtHTML()}<section class="card"><h2>🌷 Spending by Category</h2>${limits.length||Object.keys(byCat).length?[...new Set([...limits.map(x=>x.category),...Object.keys(byCat)])].map(cat=>{const lim=limits.find(x=>x.category===cat),used=byCat[cat]||0,cap=Number(lim?.amount||0);return `<div style="padding:12px 0;border-bottom:1px solid var(--border)"><div class="sectionhead"><strong>${escapeHTML(cat)}</strong><span>${money(used)} ${lim?' / '+money(cap):''}</span></div>${lim?`<div style="height:10px;border-radius:10px;background:var(--lav);overflow:hidden;margin-top:8px"><div style="height:100%;width:${Math.min(100,cap?used/cap*100:0)}%;background:${used>cap?'#e77987':'#9a79dd'}"></div></div><button class="smallbtn" onclick="budgetLimitForm('${lim.id}')">Edit budget</button>`:''}</div>`}).join(''):'<p class="emptymsg">Set a monthly budget or add a transaction to begin.</p>'}</section><section class="card"><div class="sectionhead"><h2>🧾 Transactions</h2><button class="btn primary" onclick="budgetForm()">+ Add</button></div>${rows.length?rows.map(r=>`<div class="budgetrow"><div><strong>${escapeHTML(r.title)}</strong><div class="hint">${escapeHTML(r.date)} · ${escapeHTML(r.category)}${r.debtId?' · 💳 '+escapeHTML(debtList().find(d=>d.id===r.debtId)?.title||'Debt payment'):''}</div></div><strong style="color:${r.kind==='income'?'#287b60':'#b75072'}">${r.kind==='income'?'+':'−'}${money(r.amount)}</strong><div><button class="smallbtn" onclick="budgetForm('${r.id}')">Edit</button><button class="smallbtn" onclick="budgetDelete('${r.id}')">Delete</button></div></div>`).join(''):'<p class="emptymsg">No transactions this month.</p>'}</section>`}
function budgetForm(id,selectedDebtId){const r=id?records.find(x=>x.id===id):null;const debts=debtList(),debtId=r?.debtId||selectedDebtId||'';showCustomForm(r?'Edit Transaction':'Add Transaction',[['title','Description','text',r?.title|| (debtId?'Debt repayment':'')],['kind','Type','select',r?.kind||'expense',[['expense','Expense'],['income','Income']]],['amount','Amount (NZD)','number',r?.amount||''],['category','Category','select',debtId?'Debt Payment':r?.category||'Groceries',[['Groceries','Groceries'],['Bills','Bills'],['Transport','Transport'],['Housing','Housing'],['Giving','Giving'],['Savings','Savings'],['Shopping','Shopping'],['Health','Health'],['Entertainment','Entertainment'],['Salary','Salary'],['Debt Payment','Debt Payment'],['Other','Other']]],['debtId','Link to debt (optional)','select',debtId,[['','No linked debt'],...debts.map(d=>[d.id,d.title])]],['date','Date','date',r?.date||localDay()]],v=>{if(!v.title.trim()||!v.date||!(Number(v.amount)>0))return alert('Enter a description, date and amount above zero');if(v.debtId&&v.kind!=='expense')return alert('A debt payment must be an expense.');if(v.debtId&&Number(v.amount)>debtStats(debts.find(d=>d.id===v.debtId)).balance+((r?.debtId===v.debtId)?Number(r.amount||0):0)+0.005)return alert('Payment exceeds the remaining debt balance.');saveRecord({...r,id:r?.id||uid(),type:'budget',title:v.title.trim(),kind:v.kind,amount:Number(v.amount),category:v.debtId?'Debt Payment':v.category,debtId:v.debtId||'',date:v.date});closeCustomForm()})}
function debtPaymentForm(id){budgetForm(null,id)}
function debtForm(id){const r=id?records.find(x=>x.id===id):null;showCustomForm(r?'Edit Debt':'Add Debt',[['title','Debt name','text',r?.title||''],['amount','Starting balance (NZD)','number',r?.amount||''],['date','Balance as of','date',r?.date||localDay()]],v=>{if(!v.title.trim()||!v.date||!(Number(v.amount)>0))return alert('Enter a debt name, date and balance above zero');saveRecord({...r,id:r?.id||uid(),type:'debt',title:v.title.trim(),amount:Number(v.amount),date:v.date});closeCustomForm()})}
function debtChargeForm(id){showCustomForm('Add Interest or Fee',[['title','Description','text','Interest / fee'],['amount','Amount (NZD)','number',''],['date','Date','date',localDay()]],v=>{if(!v.title.trim()||!v.date||!(Number(v.amount)>0))return alert('Enter a description, date and amount above zero');saveRecord({id:uid(),type:'debtcharge',debtId:id,title:v.title.trim(),amount:Number(v.amount),date:v.date});closeCustomForm()})}
function debtDelete(id){if(debtPayments(id).length||debtCharges(id).length){alert('This debt has payment or charge history. Remove those entries first to avoid losing their link.');return}if(!confirm('Delete this debt?'))return;const r=records.find(x=>x.id===id);if(r){r.deleted=true;saveRecord(r)}}
function budgetLimitForm(id){const r=id?records.find(x=>x.id===id):null;showCustomForm(r?'Edit Category Budget':'Category Budget',[['category','Category','select',r?.category||'Groceries',[['Groceries','Groceries'],['Bills','Bills'],['Transport','Transport'],['Housing','Housing'],['Giving','Giving'],['Savings','Savings'],['Shopping','Shopping'],['Health','Health'],['Entertainment','Entertainment'],['Other','Other']]],['amount','Monthly budget (NZD)','number',r?.amount||'']],v=>{if(!(Number(v.amount)>0))return alert('Enter a budget greater than zero');const old=r||active().find(x=>x.type==='budgetlimit'&&x.month===budgetMonth&&x.category===v.category);saveRecord({...old,id:old?.id||uid(),type:'budgetlimit',month:budgetMonth,category:v.category,amount:Number(v.amount)});closeCustomForm()})}
function budgetDelete(id){if(!confirm('Delete this transaction?'))return;const r=records.find(x=>x.id===id);if(r){r.deleted=true;saveRecord(r)}}

function mergeRecords(remote){const map=new Map(records.map(r=>[r.id,r]));remote.forEach(r=>{if(!r?.id)return;let old=map.get(r.id);if(!old||String(r.updatedAt||'')>String(old.updatedAt||''))map.set(r.id,r)});records=[...map.values()];localStorage.setItem(KEY,JSON.stringify(records));render()}
function exportBackup(){
  const payload={app:'My Digital Planner',version:1,exportedAt:new Date().toISOString(),records};
  const blob=new Blob([JSON.stringify(payload)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='My_Digital_Planner_Backup_'+localDay()+'.json';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1500);
  status('Backup downloaded • keep it somewhere private');
}
async function restoreBackup(event){
  const file=event.target.files?.[0];event.target.value='';if(!file)return;
  try{
    const data=JSON.parse(await file.text());
    if(data.app!=='My Digital Planner'||!Array.isArray(data.records))throw Error('Not a valid planner backup');
    if(!data.records.every(r=>r&&typeof r.id==='string'&&typeof r.type==='string'))throw Error('Backup contains invalid entries');
    if(!confirm('Restore this backup? Entries with the same ID will use the newer version. Please back up this device first.'))return;
    mergeRecords(data.records);
    status('✓ Backup restored • '+data.records.length+' entries checked');
  }catch(err){alert('Could not restore backup: '+err.message)}
}
load();render();
</script></body></html>
